name: finbuk
description: "Android Jellyfin client for reading comics/EPUBs and playing video, music, and audiobooks with offline support."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.1
  flutter_readium: ^0.6.2
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  sqflite: ^2.4.1
  path: ^1.9.1
  cached_network_image: ^3.3.1
  flutter_secure_storage: ^11.0.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.5
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
